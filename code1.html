<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Variable Selection Modal - Workflow Designer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .canvas-grid {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #d1d5db 1px, transparent 1px);
        }
        .dark .canvas-grid {
            background-image: radial-gradient(circle, #374151 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<!-- Workflow Editor Background (Blurred) -->
<div class="fixed inset-0 z-0 flex filter blur-sm grayscale-[0.2]">
<!-- Sidebar -->
<aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-full p-4 flex flex-col gap-4">
<div class="h-8 w-32 bg-slate-200 dark:bg-slate-800 rounded"></div>
<div class="space-y-2 mt-4">
<div class="h-10 w-full bg-slate-100 dark:bg-slate-800 rounded"></div>
<div class="h-10 w-full bg-slate-100 dark:bg-slate-800 rounded"></div>
<div class="h-10 w-full bg-slate-100 dark:bg-slate-800 rounded"></div>
</div>
</aside>
<!-- Main Canvas Area -->
<main class="flex-1 canvas-grid relative overflow-hidden bg-white dark:bg-slate-900">
<!-- Mock Nodes -->
<div class="absolute top-20 left-40 w-48 p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm">
<div class="flex items-center gap-2 mb-2">
<span class="material-icons text-primary text-sm">play_arrow</span>
<span class="text-xs font-semibold uppercase tracking-wider opacity-60">Start</span>
</div>
<div class="h-12 w-full bg-slate-50 dark:bg-slate-700/50 rounded-lg"></div>
</div>
<div class="absolute top-60 left-80 w-56 p-4 bg-white dark:bg-slate-800 border border-primary/30 dark:border-primary/50 rounded-xl shadow-lg ring-2 ring-primary/10">
<div class="flex items-center gap-2 mb-2">
<span class="material-icons text-primary text-sm">message</span>
<span class="text-xs font-semibold uppercase tracking-wider opacity-60">Send Message</span>
</div>
<div class="h-16 w-full bg-slate-50 dark:bg-slate-700/50 rounded-lg flex items-center px-3">
<div class="h-2 w-3/4 bg-primary/20 rounded"></div>
</div>
</div>
<svg class="absolute inset-0 w-full h-full pointer-events-none">
<path class="text-slate-300 dark:text-slate-700" d="M 232 108 C 280 108, 280 276, 320 276" fill="transparent" stroke="currentColor" stroke-width="2"></path>
</svg>
</main>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-md px-4">
<!-- Variable Selection Modal -->
<div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Header -->
<div class="p-5 border-b border-slate-100 dark:border-slate-800">
<div class="flex items-center justify-between mb-4">
<h2 class="text-lg font-bold text-slate-900 dark:text-white">Выбрать переменную</h2>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-icons">close</span>
</button>
</div>
<!-- Search Box -->
<div class="relative">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">search</span>
<input autofocus="" class="w-full pl-11 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-sm" placeholder="Поиск..." type="text"/>
</div>
</div>
<!-- List Content -->
<div class="flex-1 overflow-y-auto p-2">
<!-- Category: Contact -->
<div class="mb-4">
<div class="px-3 py-2 text-[11px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">
                        Контактные данные
                    </div>
<div class="space-y-0.5">
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-500">
<span class="material-icons text-base">person</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">Имя контакта</p>
<p class="text-xs text-slate-400">contact.first_name</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-500">
<span class="material-icons text-base">phone</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">Телефон</p>
<p class="text-xs text-slate-400">contact.phone</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-500">
<span class="material-icons text-base">email</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">Электронная почта</p>
<p class="text-xs text-slate-400">contact.email</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
</div>
</div>
<!-- Category: System -->
<div class="mb-4">
<div class="px-3 py-2 text-[11px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">
                        Системные
                    </div>
<div class="space-y-0.5">
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-500">
<span class="material-icons text-base">settings_suggest</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">ID Пользователя</p>
<p class="text-xs text-slate-400">system.user_id</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-500">
<span class="material-icons text-base">calendar_today</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">Текущая дата</p>
<p class="text-xs text-slate-400">system.current_date</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
</div>
</div>
<!-- Category: Custom -->
<div class="mb-4">
<div class="px-3 py-2 text-[11px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 flex justify-between items-center">
                        Пользовательские
                        <button class="text-primary hover:underline normal-case font-medium text-[12px] flex items-center gap-1">
<span class="material-icons text-[14px]">add</span> Создать
                        </button>
</div>
<div class="space-y-0.5">
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-500">
<span class="material-icons text-base">label</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">Номер заказа</p>
<p class="text-xs text-slate-400">custom.order_id</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 rounded-lg transition-colors group text-left">
<div class="w-8 h-8 rounded flex items-center justify-center bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-500">
<span class="material-icons text-base">loyalty</span>
</div>
<div class="flex-1">
<p class="text-sm font-medium text-slate-700 dark:text-slate-200">Статус подписки</p>
<p class="text-xs text-slate-400">custom.membership_level</p>
</div>
<span class="material-icons text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">add_circle_outline</span>
</button>
</div>
</div>
</div>
<!-- Footer Info -->
<div class="p-4 bg-slate-50 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800">
<p class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2">
<span class="material-icons text-[14px]">info</span>
                    Нажмите на переменную, чтобы вставить её в текущий узел.
                </p>
</div>
</div>
</div>
</body></html>
