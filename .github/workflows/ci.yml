name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-check:
    name: Verify Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution
        run: dotnet restore ChatFoundry.sln

      - name: Verify Formatting
        run: dotnet format ChatFoundry.sln --verify-no-changes --no-restore

  test-services:
    name: Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [
          { name: "BillingService", path: "services/BillingService/tests/BillingService.IntegrationTests/BillingService.IntegrationTests.csproj" },
          { name: "ClientService", path: "services/ClientService/tests/ClientService.IntegrationTests/ClientService.IntegrationTests.csproj" },
          { name: "CompanyService", path: "services/CompanyService/tests/CompanyService.IntegrationTests/CompanyService.IntegrationTests.csproj" },
          { name: "FileService", path: "services/FileService/tests/FileService.IntegrationTests/FileService.IntegrationTests.csproj" },
          { name: "Gateway", path: "services/Gateway/tests/Gateway.IntegrationTests/Gateway.IntegrationTests.csproj" },
          { name: "IdentityServer", path: "services/IdentityServer/tests/IdentityServer.IntegrationTests/IdentityServer.IntegrationTests.csproj" },
          { name: "NotificationService", path: "services/NotificationService/tests/NotificationService.IntegrationTests/NotificationService.IntegrationTests.csproj" },
          { name: "SchedulerService", path: "services/SchedulerService/tests/SchedulerService.IntegrationTests/SchedulerService.IntegrationTests.csproj" },
          { name: "TelegramService", path: "services/TelegramService/tests/TelegramService.IntegrationTests/TelegramService.IntegrationTests.csproj" },
          { name: "WorkflowService", path: "services/WorkflowService/tests/WorkflowService.IntegrationTests/WorkflowService.IntegrationTests.csproj" }
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Project
        run: dotnet restore ${{ matrix.service.path }}

      - name: Build Project
        run: dotnet build ${{ matrix.service.path }} --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ${{ matrix.service.path }} --configuration Release --no-build --no-restore --verbosity normal
