name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore dependencies
        run: dotnet restore ChatFoundry.sln

      - name: Verify formatting
        run: dotnet format ChatFoundry.sln --verify-no-changes --no-restore

      - name: Build Solution
        run: dotnet build ChatFoundry.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ChatFoundry.sln --configuration Release --no-build --no-restore --verbosity normal
