name: Continuous Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'shared/**'
      - '.github/workflows/cd.yml'
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [
          { name: "gateway", path: "services/Gateway/src/Gateway/Dockerfile" },
          { name: "workflow-service", path: "services/WorkflowService/src/WorkflowService/Dockerfile" },
          { name: "identity-service", path: "services/IdentityServer/src/IdentityServer/Dockerfile" },
          { name: "client-service", path: "services/ClientService/src/ClientService/Dockerfile" },
          { name: "telegram-service", path: "services/TelegramService/src/TelegramService/Dockerfile" },
          { name: "company-service", path: "services/CompanyService/src/CompanyService/Dockerfile" },
          { name: "billing-service", path: "services/BillingService/src/BillingService/Dockerfile" },
          { name: "file-service", path: "services/FileService/src/FileService/Dockerfile" },
          { name: "notification-service", path: "services/NotificationService/src/NotificationService/Dockerfile" },
          { name: "scheduler-service", path: "services/SchedulerService/src/SchedulerService/Dockerfile" }
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/chatfoundry/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
