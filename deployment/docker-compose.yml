version: '3.9'

services:
  gateway-service:
    container_name: gateway_service
    build:
      context: .
      dockerfile: ../services/Gateway/src/Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourPassword123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/gateway.pfx
    ports:
      - "5000:8443"
    volumes:
      - ./certs:/https:ro
    depends_on:
      - redis
    networks:
      - app_network

  workflow-service:
    container_name: workflow_service
    build:
      context: .
      dockerfile: ../services/WorkflowService/src/WorkflowService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    ports:
      - "5010:8080" # Порт для GraphQL / REST
      - "5011:8081" # НОВЫЙ порт для gRPC
    depends_on:
      - workflow-db
      - redis
    networks:
      - app_network

  workflow-db:
    image: postgres:16
    container_name: workflow_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5433:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  identity-service:
    container_name: identity_service
    build:
      context: .
      dockerfile: ../services/IdentityServer/src/IdentityServer/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5020:8080"
    depends_on:
      - identity-db
      - redis
    networks:
      - app_network

  identity-db:
    image: postgres:16
    restart: always
    container_name: identity_db
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry_db
    ports:
      - "5434:5432"
    volumes:
      - identitydata:/var/lib/postgresql/data
    networks:
      - app_network

  client-service:
    container_name: client_service
    build:
      context: .
      dockerfile: ../services/ClientService/src/ClientService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5030:8080"
    depends_on:
      - client-db
      - redis
    networks:
      - app_network

  client-db:
    image: postgres:16
    container_name: client_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5435:5432"
    volumes:
      - client_pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  telegram-service:
    container_name: telegram_service
    build:
      context: .
      dockerfile: ../services/TelegramService/src/TelegramService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5040:8080"
    depends_on:
      - telegram-db
      - redis
    networks:
      - app_network

  telegram-db:
    image: postgres:16
    container_name: telegram_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5436:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks:
      - app_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - app_network

volumes:
  identitydata:
  workflow_pgdata:
  client_pgdata:
  redis:

networks:
  app_network:
    driver: bridge
