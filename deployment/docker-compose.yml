version: '3.9'

services:
  gateway-service:
    container_name: gateway_service
    build:
      context: ..
      dockerfile: services/Gateway/src/Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourPassword123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/gateway.pfx
    env_file:
      - .env
    ports:
      - "5000:8443"
    volumes:
      - ./certs:/https:ro
    depends_on:
      - redis
    networks:
      - app_network

  workflow-service:
    container_name: workflow_service
    build:
      context: ..
      dockerfile: services/WorkflowService/src/WorkflowService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    env_file:
      - .env
    ports:
      - "5010:8080" # Порт для GraphQL / REST
      - "5011:8081" # НОВЫЙ порт для gRPC
    depends_on:
      workflow-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  workflow-db:
    image: postgres:16
    container_name: workflow_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5433:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  identity-service:
    container_name: identity_service
    build:
      context: ..
      dockerfile: services/IdentityServer/src/IdentityServer/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    env_file:
      - .env
    ports:
      - "5020:8080"
      - "5021:8081"
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  identity-db:
    image: postgres:16
    restart: always
    container_name: identity_db
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry_db
    ports:
      - "5434:5432"
    volumes:
      - identitydata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  client-service:
    container_name: client_service
    build:
      context: ..
      dockerfile: services/ClientService/src/ClientService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    ports:
      - "5030:8080"
      - "5031:8081"
    depends_on:
      client-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  client-db:
    image: postgres:16
    container_name: client_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5435:5432"
    volumes:
      - client_pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  company-service:
    container_name: company_service
    build:
      context: ..
      dockerfile: services/CompanyService/src/CompanyService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    ports:
      - "5050:8080"
      - "5051:8081"
    depends_on:
      company-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  company-db:
    image: postgres:16
    container_name: company_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5437:5432"
    volumes:
      - company_pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  telegram-service:
    container_name: telegram_service
    build:
      context: ..
      dockerfile: services/TelegramService/src/TelegramService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - .env
    ports:
      - "5040:8080"
    depends_on:
      redis:
        condition: service_started
      file-service:
        condition: service_started
    networks:
      - app_network

  file-service:
    container_name: file_service
    build:
      context: ..
      dockerfile: services/FileService/src/FileService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Http__Protocols=Http1
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
    ports:
      - "5070:8080"
      - "5071:8081"
    depends_on:
      file-db:
        condition: service_healthy
    networks:
      - app_network

  file-db:
    image: postgres:16
    container_name: file_db
    restart: always
    environment:
      POSTGRES_DB: foundry_db
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
    ports:
      - "5438:5432"
    volumes:
      - file_pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks:
      - app_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - app_network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    ports:
      - "4040:4040"
    depends_on:
      - gateway-service
    environment:
      NGROK_AUTHTOKEN: 3055WP7065mrJ8lzPXzzEzK9TaR_4EZ3RCkkF3a1nzzM7zfPo
    command: http "https://gateway-service:8443" --domain probable-dogfish-known.ngrok-free.app
    networks:
      - app_network

volumes:
  identitydata:
  workflow_pgdata:
  client_pgdata:
  company_pgdata:
  file_pgdata:
  redis:

networks:
  app_network:
    driver: bridge
